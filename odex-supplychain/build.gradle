plugins {
	id 'com.axelor.app'
}

apply from: "../libs.gradle"
apply from: "../version.gradle"

apply {
	version = openSuiteVersion
}

axelor {
	title "Odex Supply Chain"
	description "Odex Supply Chain Module"
}

dependencies {
	api project(":modules:odex-purchase")
	api project(":modules:odex-sale")
	api project(":modules:odex-stock")
	api project(":modules:odex-account")
    testImplementation libs.mockito
	implementation libs.swagger_jaxrs
}
